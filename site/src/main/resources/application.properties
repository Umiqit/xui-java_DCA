server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:xuibot}
spring.datasource.username=${DB_USER:xuibot}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

server.servlet.session.timeout=7200
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always

telegram.bot-token=${BOT_TOKEN}
telegram.admin-ids=${ADMIN_IDS:}
telegram.bot-username=${BOT_USERNAME:}
admin.panel-path=${ADMIN_PANEL_PATH:/sys/dc-panel}
